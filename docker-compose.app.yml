# Overlay that adds the RecoverySearch Next.js app to the self-hosted Supabase
# Compose project. Apply it alongside the base stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# It joins the same `supabase` project network, so the app shares the default
# network with Kong and the rest of the stack.

services:
  web:
    container_name: recoverysearch-web
    build:
      context: ./web
      args:
        # NEXT_PUBLIC_* are inlined into the browser bundle at build time, so
        # they must be supplied as build args (not just runtime env).
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_started
    environment:
      # Runtime copies for server components / server actions.
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      NODE_ENV: production
    ports:
      - "${WEB_HTTP_PORT:-3000}:3000"
